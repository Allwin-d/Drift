<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <g transform="rotate(-6 100 100)">
    <!-- Outer dashed circle -->
    <circle
      cx="100" cy="100" r="92"
      fill="none"
      stroke="#C79A44"
      stroke-width="2.5"
      stroke-dasharray="3 10"
      stroke-linecap="round"
    />

    <!-- Inner thin circle -->
    <circle
      cx="100" cy="100" r="80"
      fill="none"
      stroke="#C79A44"
      stroke-opacity="0.35"
      stroke-width="1.5"
    />

    <!-- Sun icon (simple rays + circle) -->
    <g transform="translate(100 68)" stroke="#C79A44" stroke-width="2.2" stroke-linecap="round" fill="none">
      <circle cx="0" cy="0" r="10" />
      <line x1="0" y1="-18" x2="0" y2="-14" />
      <line x1="0" y1="14" x2="0" y2="18" />
      <line x1="-18" y1="0" x2="-14" y2="0" />
      <line x1="14" y1="0" x2="18" y2="0" />
      <line x1="-12.7" y1="-12.7" x2="-9.9" y2="-9.9" />
      <line x1="9.9" y1="9.9" x2="12.7" y2="12.7" />
      <line x1="-12.7" y1="12.7" x2="-9.9" y2="9.9" />
      <line x1="9.9" y1="-9.9" x2="12.7" y2="-12.7" />
    </g>

    <!-- Temperature -->
    <text x="100" y="108" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#C79A44">29°C</text>

    <!-- Coordinates -->
    <text x="100" y="128" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#C79A44" opacity="0.85">13.08°N, 80.27°E</text>

    <!-- Date -->
    <text x="100" y="144" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#C79A44" opacity="0.65">27 JUL</text>
  </g>
</svg>
